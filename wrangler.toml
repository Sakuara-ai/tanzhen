name = "tanzhen"
main = "src/index.js"
compatibility_date = "2026-06-05"

# 告诉 Cloudflare 该项目需要一个 D1 数据库，绑定名称必须是 DB
[[d1_databases]]
binding = "DB"
database_name = "monitor_db" # 默认数据库名称，用户可以在部署向导中新建或修改
database_id = "232d4d3f-51dc-43bb-9edf-5ad31596cde4" # 留空即可，一键部署时向导会自动处理

# 告诉 Cloudflare 该项目需要环境变量，部署向导会提示用户填写
[vars]
API_SECRET = "30141592653" # 默认探针通信密钥和后台管理密码
